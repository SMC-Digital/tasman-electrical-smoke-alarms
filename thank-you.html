<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You | Tasman Electrical</title>
<meta name="description" content="Thanks for your smoke alarm enquiry. Tasman Electrical will be in touch shortly." />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://smokealarms.tasmanelectrical.com.au/thank-you" />
<link rel="icon" type="image/png" href="assets/images/favicon-64.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Tracking config (shared with index.html). Loads GTM if configured. -->
<script src="assets/config.js"></script>
<!-- Fire the lead conversion on the thank-you page (GTM/GA4/Ads/Meta listen for this). -->
<script>window.dataLayer.push({ event: 'generate_lead', form_location: 'thank_you_page', method: 'redirect' });</script>
<style>
:root{ --green:#22B14C; --green-ink:#157A34; --ink:#0E1A14; --muted:#55635C; --line:#E2EAE5; }
*{ box-sizing:border-box; } html,body{ margin:0; }
body{ font-family:"Inter",Arial,sans-serif; color:#182420; background:#F4F8F5; min-height:100vh; display:flex; flex-direction:column; }
a{ color:inherit; text-decoration:none; }
h1,h2{ font-family:"Poppins",Arial,sans-serif; margin:0; line-height:1.15; letter-spacing:-.01em; }
header{ background:var(--ink); padding:14px 20px; text-align:center; }
header img{ height:48px; }
.wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:48px 20px; }
.card{ background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 14px 40px rgba(14,26,20,.10); max-width:560px; width:100%; padding:44px 34px; text-align:center; }
.tick{ width:74px; height:74px; margin:0 auto 20px; color:var(--green); }
.card h1{ font-size:1.9rem; font-weight:800; color:var(--ink); }
.card p{ color:var(--muted); margin:14px 0 0; font-size:1.05rem; line-height:1.6; }
.actions{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:28px; }
.btn{ display:inline-flex; align-items:center; gap:9px; font-family:"Poppins",Arial,sans-serif; font-weight:700; padding:14px 24px; border-radius:8px; min-height:50px; }
.btn svg{ width:19px; height:19px; }
.btn--primary{ background:var(--green); color:var(--ink); box-shadow:0 8px 20px rgba(34,177,76,.3); }
.btn--ghost{ background:transparent; color:var(--ink); border:2px solid var(--line); }
.foot{ text-align:center; padding:22px 20px; color:var(--muted); font-size:.82rem; }
:focus-visible{ outline:3px solid var(--green); outline-offset:2px; }
</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="Tasman Electrical home"><img src="assets/images/logo.png" alt="Tasman Electrical logo" /></a>
</header>
<main class="wrap">
  <div class="card">
    <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 2.5 2.5L16 9"/></svg>
    <h1>Thanks, your request has been received</h1>
    <p>Tasman Electrical will be in touch shortly to discuss your property and arrange an assessment where required. Need us sooner? Give us a call.</p>
    <div class="actions">
      <a class="btn btn--primary" href="tel:0424134830" data-track="phone_click" data-loc="thank_you">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
        Call 0424 134 830
      </a>
      <a class="btn btn--ghost" href="index.html">Back to home</a>
    </div>
  </div>
</main>
<div class="foot" id="copyright">&copy; Tasman Electrical. All rights reserved.</div>
<script>document.getElementById('copyright').textContent='© '+new Date().getFullYear()+' Tasman Electrical. All rights reserved.';</script>
</body>
</html>
